services:
  streetview-host:
  # Node.js HTTP server managing Playwright browser + page pool
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      POOL_SIZE: "80"
      STREETVIEW_HOST_PORT: "3000"
    shm_size: "5gb"
    restart: "no"
    ports:
      - "3000:3000"

  geoguessr-worker:
  # Python Flask server (engines + nav_tools)
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python3", "-m", "apps.geoguessr_server"]
    environment:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      IMAGE_OUTPUT_DIR: /data/images
      SERVER_PORT: "8000"
      STREETVIEW_HOST_URL: "http://streetview-host:3000"
      USE_WAITRESS: "true"
    volumes:
      - geoguessr-images:/data/images
    depends_on:
      - streetview-host
    restart: "no"
    ports:
      - "8000:8000"

volumes:
  geoguessr-images:
